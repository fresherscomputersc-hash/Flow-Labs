<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="QR Business Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#10231b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E9F6E"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g fill="url(#acc)">
    <!-- stylised QR finder squares -->
    <g transform="translate(560,270)">
      <rect x="0" y="0" width="120" height="120" rx="14" fill="none" stroke="url(#acc)" stroke-width="14"/>
      <rect x="38" y="38" width="44" height="44" rx="8"/>
      <use href="#f" transform="translate(240,0)"/>
      <use href="#f" transform="translate(0,240)"/>
    </g>
    <g id="f" transform="translate(800,270)">
      <rect width="120" height="120" rx="14" fill="none" stroke="url(#acc)" stroke-width="14"/>
      <rect x="38" y="38" width="44" height="44" rx="8"/>
    </g>
    <g transform="translate(560,510)">
      <rect width="120" height="120" rx="14" fill="none" stroke="url(#acc)" stroke-width="14"/>
      <rect x="38" y="38" width="44" height="44" rx="8"/>
    </g>
    <!-- data modules -->
    <rect x="800" y="510" width="34" height="34" rx="6"/>
    <rect x="852" y="562" width="34" height="34" rx="6"/>
    <rect x="904" y="510" width="34" height="34" rx="6"/>
    <rect x="852" y="510" width="20" height="20" rx="4" opacity=".55"/>
  </g>
  <text x="720" y="740" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#e8edf2">QR Business Platform</text>
  <text x="720" y="790" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="24" fill="#93a4b8">one scan · one page · every business</text>
</svg>
