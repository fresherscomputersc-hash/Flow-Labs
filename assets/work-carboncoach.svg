<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060605"/><stop offset="1" stop-color="#0c1510"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#143d1a"/><stop offset="1" stop-color="#1f5a2a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg3)"/>
  <rect x="0" y="0" width="640" height="34" fill="#101012"/>
  <circle cx="20" cy="17" r="5" fill="#A31c1b"/><circle cx="38" cy="17" r="5" fill="#143d1a"/><circle cx="56" cy="17" r="5" fill="#2a2a2e"/>
  <text x="80" y="21" font-family="monospace" font-size="9" fill="#6d6d7c">carbon-coach · weekly report</text>
  <!-- hero gauge -->
  <rect x="20" y="52" width="200" height="160" rx="12" fill="#101014" stroke="rgba(20,61,26,.45)"/>
  <path d="M60 170 a60 60 0 0 1 120 0" stroke="#1d1d21" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M60 170 a60 60 0 0 1 96 -44" stroke="url(#bar)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f2f0ec">62%</text>
  <text x="120" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a9085">of monthly budget</text>
  <rect x="36" y="190" width="168" height="12" rx="6" fill="#160d0e"/>
  <rect x="36" y="190" width="104" height="12" rx="6" fill="#A31c1b"/>
  <!-- weekly bars -->
  <rect x="236" y="52" width="384" height="160" rx="12" fill="#101014" stroke="rgba(255,255,255,.08)"/>
  <text x="252" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f2f0ec">Footprint by day (kg CO₂)</text>
  <g fill="url(#bar)">
    <rect x="260" y="120" width="34" height="64" rx="4"/>
    <rect x="308" y="100" width="34" height="84" rx="4"/>
    <rect x="356" y="132" width="34" height="52" rx="4"/>
    <rect x="404" y="88" width="34" height="96" rx="4"/>
    <rect x="452" y="116" width="34" height="68" rx="4"/>
  </g>
  <g fill="#A31c1b">
    <rect x="500" y="140" width="34" height="44" rx="4"/>
    <rect x="548" y="152" width="34" height="32" rx="4"/>
  </g>
  <text x="264" y="192" font-family="sans-serif" font-size="8" fill="#6d6d7c">M T W T F S S</text>
  <!-- coach cards -->
  <rect x="20" y="228" width="300" height="152" rx="12" fill="#101014" stroke="rgba(163,28,27,.35)"/>
  <text x="36" y="252" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f2f0ec">Coach nudge</text>
  <rect x="36" y="264" width="268" height="1" fill="rgba(255,255,255,.08)"/>
  <text x="36" y="286" font-family="sans-serif" font-size="10" fill="#c98a8a">Your commute spiked +18% this week.</text>
  <text x="36" y="304" font-family="sans-serif" font-size="10" fill="#8a9085">Try 2 car-free days — saves ~9 kg.</text>
  <rect x="36" y="318" width="120" height="26" rx="13" fill="#160d0e" stroke="rgba(163,28,27,.5)"/>
  <text x="50" y="335" font-family="sans-serif" font-size="10" fill="#e08a8a">Accept challenge</text>
  <!-- streak -->
  <rect x="336" y="228" width="284" height="152" rx="12" fill="#101014" stroke="rgba(20,61,26,.45)"/>
  <text x="352" y="252" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f2f0ec">Green streak</text>
  <rect x="352" y="264" width="252" height="1" fill="rgba(255,255,255,.08)"/>
  <g>
    <rect x="352" y="278" width="26" height="26" rx="6" fill="#143d1a"/>
    <rect x="384" y="278" width="26" height="26" rx="6" fill="#143d1a"/>
    <rect x="416" y="278" width="26" height="26" rx="6" fill="#1f5a2a"/>
    <rect x="448" y="278" width="26" height="26" rx="6" fill="#143d1a"/>
    <rect x="480" y="278" width="26" height="26" rx="6" fill="#143d1a"/>
    <rect x="512" y="278" width="26" height="26" rx="6" fill="#A31c1b"/>
    <rect x="544" y="278" width="26" height="26" rx="6" fill="#1d1d21"/>
  </g>
  <text x="352" y="330" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1f5a2a">12</text>
  <text x="384" y="330" font-family="sans-serif" font-size="10" fill="#8a9085">day streak · best 21</text>
  <text x="352" y="356" font-family="sans-serif" font-size="10" fill="#8a9085">−12% vs last month</text>
</svg>
