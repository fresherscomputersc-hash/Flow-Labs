  <text x="34" y="366" font-family="sans-serif" font-size="13" font-weight="bold" fill="#143d1a">8.6 / 10</text>
  <rect x="184" y="330" width="150" height="44" rx="10" fill="#160d0e" stroke="rgba(163,28,27,.45)"/>
  <text x="198" y="350" font-family="sans-serif" font-size="10" fill="#c98a8a">Clarity</text>
  <text x="198" y="366" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A31c1b">9.1 / 10</text>
  <rect x="348" y="330" width="272" height="44" rx="10" fill="#141418" stroke="rgba(255,255,255,.08)"/>
  <text x="364" y="357" font-family="sans-serif" font-size="11" fill="#f2f0ec">Python · ML · DSA — mock ready</text>
