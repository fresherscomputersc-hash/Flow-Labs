<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/><stop offset="1" stop-color="#0d1a10"/>
    </linearGradient>
    <linearGradient id="crim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A31c1b"/><stop offset="1" stop-color="#c63a45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- window chrome -->
  <rect x="0" y="0" width="640" height="34" fill="#141416"/>
  <circle cx="20" cy="17" r="5" fill="#A31c1b"/>
  <circle cx="38" cy="17" r="5" fill="#143d1a"/>
  <circle cx="56" cy="17" r="5" fill="#2a2a2e"/>
  <rect x="80" y="10" width="300" height="14" rx="7" fill="#1d1d21"/>
  <text x="92" y="21" font-family="monospace" font-size="9" fill="#6d6d7c">interview-copilot · live session</text>
  <!-- left: video pane -->
  <rect x="20" y="52" width="300" height="200" rx="12" fill="#101014" stroke="rgba(163,28,27,.35)"/>
  <circle cx="170" cy="130" r="42" fill="#1a1a20" stroke="#A31c1b" stroke-width="2"/>
  <circle cx="170" cy="118" r="16" fill="#26262e"/>
  <path d="M142 168 a28 24 0 0 1 56 0" fill="#26262e"/>
  <rect x="40" y="212" width="60" height="22" rx="11" fill="url(#crim)"/>
