  <rect x="352" y="86" width="200" height="8" rx="4" fill="#1d1d21"/>
  <rect x="352" y="102" width="252" height="8" rx="4" fill="#1d1d21"/>
  <rect x="352" y="118" width="170" height="8" rx="4" fill="#143d1a"/>
  <rect x="352" y="140" width="252" height="8" rx="4" fill="#1d1d21"/>
  <rect x="352" y="156" width="210" height="8" rx="4" fill="#1d1d21"/>
  <rect x="352" y="180" width="252" height="46" rx="8" fill="#160d0e" stroke="rgba(163,28,27,.5)"/>
  <text x="364" y="198" font-family="sans-serif" font-size="9" fill="#e08a8a">Suggested answer ↓</text>
  <rect x="364" y="206" width="200" height="6" rx="3" fill="#3a1416"/>
  <rect x="364" y="216" width="160" height="6" rx="3" fill="#3a1416"/>
  <!-- waveform -->
  <g fill="#A31c1b">
    <rect x="24" y="286" width="5" height="24" rx="2"/><rect x="34" y="276" width="5" height="44" rx="2"/>
    <rect x="44" y="266" width="5" height="64" rx="2"/><rect x="54" y="282" width="5" height="32" rx="2"/>
    <rect x="64" y="272" width="5" height="52" rx="2"/><rect x="74" y="288" width="5" height="20" rx="2"/>
    <rect x="84" y="262" width="5" height="72" rx="2"/><rect x="94" y="278" width="5" height="38" rx="2"/>
    <rect x="104" y="286" width="5" height="24" rx="2"/><rect x="114" y="270" width="5" height="56" rx="2"/>
    <rect x="124" y="284" width="5" height="28" rx="2"/><rect x="134" y="264" width="5" height="68" rx="2"/>
    <rect x="144" y="280" width="5" height="36" rx="2"/><rect x="154" y="288" width="5" height="20" rx="2"/>
  </g>
  <text x="176" y="306" font-family="monospace" font-size="10" fill="#6d6d7c">voice → text → feedback</text>
